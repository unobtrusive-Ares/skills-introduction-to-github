name: Import Hypit

on:
  push:
    branches:
      - import-hypit

permissions:
  contents: write

jobs:
  import:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Hypit
        run: git clone --depth 1 https://github.com/hypit-ai/hypit.git /tmp/hypit

      - name: Replace repository contents with Hypit
        run: |
          rm -rf -- * .[^.]* ..?* 2>/dev/null || true
          rsync -a --exclude='.git' /tmp/hypit/ ./

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import hypit-ai/hypit [skip ci]" || exit 0
          git push origin HEAD:import-hypit
